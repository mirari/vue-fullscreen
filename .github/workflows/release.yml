name: Release
on:
  push:
    tags: ['vue2-v*', 'vue3-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.release.outputs.line }}
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require reviewed default-branch commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:consumers
      - id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-info.mjs "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: artifacts/vue-fullscreen-${{ steps.release.outputs.version }}.tgz
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts
      - name: Publish verified tarball using npm trusted publishing
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: npm publish "artifacts/vue-fullscreen-$VERSION.tgz" --tag "$CHANNEL" --access public --provenance
  release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md" --latest=false)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "artifacts/vue-fullscreen-$VERSION.tgz" "${args[@]}"
